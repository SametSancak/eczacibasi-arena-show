<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eczacıbaşı Spor Kulübü • Taraftar Işık Şovu</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background-color: #FF6600;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 14px;
      transition: background-color 0.08s ease;
      overflow-x: hidden;
      user-select: none;
    }

    #countdownText {
      display: none;
      font-size: 9rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 8px 30px rgba(0,0,0,0.45);
      z-index: 20;
    }
    .top-bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .badge { background: rgba(0,0,0,0.35); padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 800; }
    .setup-card {
      background: rgba(15, 15, 18, 0.92);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 22px;
      padding: 16px;
      width: 100%;
      max-width: 430px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      z-index: 10;
    }
    h1 { font-size: 1.3rem; font-weight: 900; color: #FF6600; text-transform: uppercase; }
    .sub { font-size: 0.82rem; color: #D4D4D8; margin: 4px 0 10px 0; }
    svg { width: 100%; max-height: 270px; background: #18181B; border-radius: 14px; padding: 6px; border: 1px solid #27272A; }
    .blk { cursor: pointer; transition: opacity 0.15s; stroke: #18181B; stroke-width: 1.5; }
    .blk:hover { opacity: 0.85; }
    .blk.selected { stroke: #FFFFFF; stroke-width: 3.5; filter: drop-shadow(0 0 6px #FFFFFF); }
    .blk-txt { font-size: 7px; font-weight: 800; fill: #111; pointer-events: none; text-anchor: middle; }
    .blk-txt.light { fill: #FFF; }
    .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    select {
      padding: 10px 8px; border-radius: 10px; border: 1px solid #3F3F46;
      background: #27272A; color: #FFF; font-weight: 700; font-size: 0.82rem;
    }
    .btn-join {
      width: 100%; margin-top: 12px; padding: 15px;
      background: linear-gradient(135deg, #FF6600, #EA580C);
      color: #FFFFFF; border: none; border-radius: 14px;
      font-size: 1.05rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,102,0,0.4);
    }
    .btn-join:active { transform: scale(0.97); }
    .active-overlay {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px; transition: opacity 0.3s;
    }
    .active-overlay h2 { font-size: 2rem; font-weight: 900; text-shadow: 0 2px 12px rgba(0,0,0,0.4); }
    .btn-edit {
      margin-top: 20px; background: rgba(0,0,0,0.4); color: #FFF;
      border: 1px solid rgba(255,255,255,0.4); padding: 10px 18px;
      border-radius: 20px; font-size: 0.85rem; cursor: pointer; font-weight: 700;
    }
    .footer { background: rgba(0,0,0,0.35); padding: 7px 16px; border-radius: 14px; font-size: 0.8rem; font-weight: 700; z-index: 10; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="badge">ECZACIBAŞI SPOR KULÜBÜ</div>
    <div class="badge" id="onlineBadge">● BAĞLANIYOR</div>
  </div>

  <div class="setup-card" id="setupCard">
    <h1>KOLTUĞUNU SEÇ</h1>
    <p class="sub">Krokiden bloğuna dokun veya aşağıdan seçerek şova katıl</p>

      <text x="183" y="244" class="blk-txt light">VIP 102</text>

      <rect id="b_VIP2_101" class="blk" x="208" y="232" width="42" height="18" rx="3" fill="#FB923C" onclick="selectBlock('VIP2_101')"/>
      <text x="229" y="244" class="blk-txt light">VIP 101</text>

      <!-- SAĞ TRİBÜNLER -->

    <div class="controls">
      <select id="blockSelect" onchange="syncMapFromSelect()">
        <option value="109_T66" selected>109 Alt Tribün 66</option>

        <option value="TRIB_108">Tribün 66 - 108</option>
        <option value="UST_108">Üst 108</option>
        <option value="ALT_110">Alt 110</option>
        <option value="TRIB_110">Tribün 66 - 110</option>
        <option value="UST_110">Üst 110</option>
        <option value="ALT_111">Alt 111</option>
        <option value="UST_111">Üst 111</option>
        <option value="ALT_112">Alt 112</option>
        <option value="UST_112">Üst 112</option>
        <option value="ALT_113">Alt 113</option>
        <option value="UST_113">Üst 113</option>
        <option value="ALT_114">Alt 114</option>
        <option value="UST_114">Üst 114</option>
        <option value="VIP2_101">VIP 101</option>
        <option value="VIP2_102">VIP 102</option>
        <option value="VIP2_103">VIP 103</option>
        <option value="ALT_104">Alt 104</option>
        <option value="UST_104">Üst 104</option>
        <option value="ALT_105">Alt 105</option>

      </select>
      <select id="rowSelect" onchange="updateFooter()">
        <option value="1">Sıra 1</option><option value="2">Sıra 2</option><option value="3">Sıra 3</option>
        <option value="4" selected>Sıra 4</option><option value="5">Sıra 5</option><option value="6">Sıra 6</option>
        <option value="7">Sıra 7</option><option value="8">Sıra 8</option><option value="9">Sıra 9</option>
        <option value="10">Sıra 10</option><option value="11">Sıra 11</option><option value="12">Sıra 12</option>
      </select>
      <select id="seatSelect" onchange="updateFooter()">
        <option value="1">Koltuk 1</option><option value="5">Koltuk 5</option><option value="10">Koltuk 10</option>
        <option value="14" selected>Koltuk 14</option><option value="18">Koltuk 18</option><option value="22">Koltuk 22</option>
      </select>

    <button type="button" class="btn-join" onclick="activateShow()">IŞIK ŞOVUNA KATIL</button>
  </div>
  <div id="countdownText">10</div>
  <div class="active-overlay" id="activeScreen">
    <h2>ŞOVA BAĞLANDIN!</h2>
    <p style="margin-top:8px; font-weight:600;">Ekran parlaklığını sona getir ve telefonunu havaya kaldır.</p>
    <button type="button" class="btn-edit" onclick="editSeat()">Koltuk Değiştir</button>
  </div>

  <div class="footer" id="seatFooter">109 Alt Tribün 66 • Sıra 4 • Koltuk 14</div>

  <script>
    var isJoined = false;
    var wakeLock = null;
    var effectInterval = null;
    var socket = (typeof io !== 'undefined') ? io() : null;

    var blockAngleMap = {
      'VIP2_101': 0.0, 'VIP1_101': 0.0, 'VIP2_102': 0.5, 'VIP1_102': 0.5, 'VIP2_103': 1.0, 'VIP1_103': 1.0,
      'ALT_104': 1.6, 'UST_104': 1.7, 'ALT_105': 2.2, 'UST_105': 2.3, 'ALT_106_IC': 2.8, 'ALT_106': 2.9, 'UST_106': 3.0,
      'MISAFIR_107': 3.6, 'MISAFIR_108': 4.1, 'TRIB_108': 4.5, 'ALT_108': 4.6, 'UST_108': 4.7,
      '109_T66': 5.2, 'ALT_109': 5.3, 'UST_109_1': 5.4, 'UST_109': 5.5,
      'TRIB_110': 6.0, 'ALT_110': 6.1, 'UST_110': 6.2, 'ALT_111': 6.7, 'UST_111': 6.8,
      'ALT_112_IC': 7.3, 'ALT_112': 7.4, 'UST_112': 7.5, 'ALT_113': 8.0, 'UST_113': 8.1, 'ALT_114': 8.6, 'UST_114': 8.7
    };

    var urlBlok = new URLSearchParams(window.location.search).get('blok');
    if (urlBlok && blockAngleMap[urlBlok] !== undefined) {
      selectBlock(urlBlok);
    }

    function selectBlock(code) {
      document.querySelectorAll('.blk').forEach(function(el) { el.classList.remove('selected'); });
      var target = document.getElementById('b_' + code);
      if (target) target.classList.add('selected');
      var sel = document.getElementById('blockSelect');
      if (sel && sel.querySelector('option[value="' + code + '"]')) sel.value = code;
      updateFooter();
    }

    function syncMapFromSelect() {
      selectBlock(document.getElementById('blockSelect').value);
    }

    function updateFooter() {
      var sel = document.getElementById('blockSelect');
      var bText = sel.options[sel.selectedIndex].text;
      document.getElementById('seatFooter').innerText = bText + ' • Sıra ' + document.getElementById('rowSelect').value + ' • Koltuk ' + document.getElementById('seatSelect').value;
    }

    function activateShow() {
      isJoined = true;
      document.getElementById('setupCard').style.display = 'none';
      document.getElementById('activeScreen').style.display = 'flex';
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function(wl) { wakeLock = wl; }).catch(function() {});
      }
    }

    function editSeat() {
      isJoined = false;
      clearInterval(effectInterval);
      var cdEl = document.getElementById('countdownText');
      if (cdEl) cdEl.style.display = 'none';
      document.body.style.backgroundColor = '#FF6600';
      document.getElementById('activeScreen').style.display = 'none';
      document.getElementById('setupCard').style.display = 'block';
    }

    function handleCommand(cmd) {
      if (!isJoined || !cmd) return;
      clearInterval(effectInterval);

      var overlay = document.getElementById('activeScreen');
      var cdEl = document.getElementById('countdownText');
      if (cdEl) cdEl.style.display = 'none';

      var blok = document.getElementById('blockSelect').value;
      var seatNo = parseInt(document.getElementById('seatSelect').value, 10) || 10;
      var anglePos = (blockAngleMap[blok] !== undefined) ? blockAngleMap[blok] : 5.0;
      var seatOffsetMs = seatNo * 12;

      overlay.style.opacity = (cmd.mode === 'IDLE') ? '1' : '0.15';

      if (cmd.mode === 'SOLID_ORANGE') {
        document.body.style.backgroundColor = '#FF6600';
      } else if (cmd.mode === 'SOLID_WHITE') {
        document.body.style.backgroundColor = '#FFFFFF';
      } else if (cmd.mode === 'STROBE') {
        var on = false;
        effectInterval = setInterval(function() {
          on = !on;
          document.body.style.backgroundColor = on ? '#FFFFFF' : '#FF6600';
        }, cmd.speed || 120);
      } else if (cmd.mode === 'WAVE_CW') {
        document.body.style.backgroundColor = '#141414';
        setTimeout(function() {
          document.body.style.backgroundColor = '#FFFFFF';
          setTimeout(function() { document.body.style.backgroundColor = '#FF6600'; }, 380);
        }, (anglePos * 260) + seatOffsetMs);
      } else if (cmd.mode === 'WAVE_CCW') {
        document.body.style.backgroundColor = '#141414';
        setTimeout(function() {
          document.body.style.backgroundColor = '#FFFFFF';
          setTimeout(function() { document.body.style.backgroundColor = '#FF6600'; }, 380);
        }, ((9.0 - anglePos) * 260) + seatOffsetMs);
      } else if (cmd.mode === 'COUNTDOWN') {
        overlay.style.opacity = '0';
        if (cdEl) cdEl.style.display = 'block';
        var totalSec = cmd.duration || 10;
        var endTime = (cmd.startTime || Date.now()) + (totalSec * 1000);

        effectInterval = setInterval(function() {
          var remaining = Math.ceil((endTime - Date.now()) / 1000);
          if (remaining > 0) {
            if (cdEl) cdEl.innerText = remaining;
            if (remaining <= 3) {
              document.body.style.backgroundColor = '#FFFFFF';
              if (cdEl) cdEl.style.color = '#FF6600';
              setTimeout(function() {
                document.body.style.backgroundColor = '#FF6600';
                if (cdEl) cdEl.style.color = '#FFFFFF';
              }, 220);
            } else {
              document.body.style.backgroundColor = '#FF6600';
              if (cdEl) cdEl.style.color = '#FFFFFF';
            }
          } else {
            clearInterval(effectInterval);
            if (cdEl) cdEl.style.display = 'none';
            handleCommand({ mode: 'STROBE', speed: 95 });
          }
        }, 200);
      } else {
        document.body.style.backgroundColor = '#FF6600';
      }
    }

    if (socket) {
      socket.on('connect', function() {
        document.getElementById('onlineBadge').innerText = '● CANLI BAĞLI';
      });
      socket.on('show_command', handleCommand);
    }
  </script>
</body>
</html>
