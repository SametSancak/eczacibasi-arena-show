<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eczacıbaşı Arena • Reji & DJ Kontrol Masası</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #09090B; color: #FFF; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .panel { background: #18181B; border: 1px solid #27272A; border-radius: 18px; padding: 24px; width: 100%; max-width: 680px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
    h1 { color: #FF6600; font-size: 1.35rem; margin: 0 0 6px 0; text-transform: uppercase; }
    .sub { color: #A1A1AA; font-size: 0.85rem; margin-bottom: 18px; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #3F3F46; background: #09090B; color: #FFF; font-size: 1rem; margin-bottom: 12px; }
    .btn-primary { width: 100%; padding: 14px; background: #FF6600; color: #FFF; border: none; border-radius: 10px; font-weight: 800; font-size: 1rem; cursor: pointer; }
    .btn-primary:active { transform: scale(0.98); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .fx { padding: 20px 12px; border: none; border-radius: 12px; font-weight: 900; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; }
    .fx:active { transform: scale(0.96); }
    .orange { background: #FF6600; color: #FFF; }
    .white { background: #FFF; color: #111; }
    .ace { background: linear-gradient(135deg, #FF6600, #FFF); color: #000; }
    .point { background: #EA580C; color: #FFF; border: 2px solid #FFF; }
    .wave { background: #2563EB; color: #FFF; }
    .idle { background: #27272A; color: #D4D4D8; grid-column: span 2; padding: 14px; }
    .status { margin-top: 16px; padding: 12px 16px; background: #09090B; border-radius: 10px; border-left: 4px solid #22C55E; display: flex; justify-content: space-between; font-size: 0.85rem; color: #22C55E; }
    .conn-pill { display: inline-block; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; background: #27272A; color: #FACC15; margin-bottom: 14px; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Reji Giriş Ekranı -->
  <div class="panel" id="loginBox" style="max-width:420px;">
    <h1>ECZACIBAŞI REJİ GİRİŞİ</h1>
    <p class="sub">Arena Işık Şovu Yönetim Konsolu</p>
    <div class="conn-pill" id="connStatus">Sunucu bağlantısı kontrol ediliyor...</div>
    <input type="password" id="djPass" placeholder="Reji Şifresi (Eczacibasi1966!)" onkeydown="if(event.key==='Enter') login()">
    <button type="button" class="btn-primary" onclick="login()">KONSOLU AÇ</button>
    <p id="err" style="color:#EF4444; font-size:0.85rem; margin-top:10px; font-weight:600;"></p>
  </div>

  <!-- DJ Kontrol Masası -->
  <div class="panel" id="consoleBox" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>ARENA CANLI IŞIK KONSOLU</h1>
      <span style="background:#14532D; color:#4ADE80; padding:6px 12px; border-radius:20px; font-size:0.8rem; font-weight:800;">
        BAĞLI TARAFTAR: <strong id="fanCount">1</strong>
      </span>
    </div>
    <p class="sub">Salondaki tüm telefonlara anlık WebSocket komutu gönderilir</p>

    <div class="grid">
      <button type="button" class="fx orange" onclick="sendCmd('SOLID_ORANGE')">SABİT TURUNCU</button>
      <button type="button" class="fx white" onclick="sendCmd('SOLID_WHITE')">SABİT BEYAZ</button>
      <button type="button" class="fx ace" onclick="sendCmd('STROBE', 95)">ACE! HIZLI FLAŞ</button>
      <button type="button" class="fx point" onclick="sendCmd('STROBE', 230)">SAYI RİTMİ (ORTA)</button>
      <button type="button" class="fx wave" onclick="sendCmd('WAVE_CW')">360° DALGA (SAAT YÖNÜ)</button>
      <button type="button" class="fx wave" onclick="sendCmd('WAVE_CCW')">360° DALGA (TERS YÖN)</button>
      <button type="button" class="fx idle" onclick="sendCmd('IDLE')">BEKLEME MODUNA DÖN</button>
    </div>

    <div class="status">
      <span id="log">Sistem hazır. Komut bekleniyor...</span>
      <span id="footerBadge">CANLI ● AKTİF</span>
    </div>
  </div>

  <script>
    var socket = null;
    var isConnected = false;

    function openPanel(modeText) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('consoleBox').style.display = 'block';
      document.getElementById('footerBadge').innerText = modeText;
    }

    function login() {
      var pass = document.getElementById('djPass').value.trim();
      var errEl = document.getElementById('err');
      errEl.innerText = '';

      if (!pass) {
        errEl.innerText = 'Lütfen reji şifresini girin.';
        return;
      }

      if (socket && isConnected) {
        socket.emit('dj_auth', pass, function(res) {
          if (res && res.success) {
            openPanel('SUNUCU WEBSOCKET ● AKTİF');
          } else {
            errEl.innerText = (res && res.message) ? res.message : 'Hatalı şifre!';
          }
        });
      } else {
        errEl.innerText = 'Sunucu bağlı değil! Terminalde "npm start" çalıştırıp http://localhost:3000/dj.html adresinden girin.';
      }
    }

    function sendCmd(mode, speed) {
      if (!speed) speed = 150;
      if (socket && isConnected) {
        socket.emit('dj_trigger', { mode: mode, speed: speed });
        document.getElementById('log').innerText = 'Gönderildi: ' + mode + ' (' + new Date().toLocaleTimeString() + ')';
      }
    }

    // Sunucu üzerinden (http/https) açıldıysa Socket.io yükle
    if (window.location.protocol.startsWith('http')) {
      var s = document.createElement('script');
      s.src = '/socket.io/socket.io.js';
      s.onload = function() {
        socket = io();
        socket.on('connect', function() {
          isConnected = true;
          var pill = document.getElementById('connStatus');
          pill.style.background = '#14532D';
          pill.style.color = '#4ADE80';
          pill.innerText = '● Sunucu Bağlı (localhost / Azure)';
        });
        socket.on('disconnect', function() {
          isConnected = false;
          var pill = document.getElementById('connStatus');
          pill.style.background = '#7F1D1D';
          pill.style.color = '#FCA5A5';
          pill.innerText = '● Sunucu Bağlantısı Kesildi';
        });
        socket.on('fan_count', function(count) {
          document.getElementById('fanCount').innerText = count;
        });
      };
      s.onerror = function() {
        document.getElementById('connStatus').innerText = '● Socket.io yüklenemedi (npm start çalışıyor mu?)';
      };
      document.head.appendChild(s);
    } else {
      var pill = document.getElementById('connStatus');
      pill.style.background = '#7F1D1D';
      pill.style.color = '#FCA5A5';
      pill.innerText = '● HATA: Dosya olarak açıldı! http://localhost:3000/dj.html kullanın.';
    }
  </script>
</body>
</html>
